name: CI/CD Deploys to cPanel

on:
  push:
    branches:
      - main  # Triggers the workflow whenever you push to the main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download the repository code to the runner
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # --- BUILD FRONTEND ---
      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      # --- BUILD BACKEND ---
      - name: Build Backend
        run: |
          cd backend
          npm ci
          npm run build

      # --- DEPLOY FRONTEND TO PUBLIC_HTML ---
      - name: Deploy Frontend to cPanel
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: ${{ secrets.SFTP_PORT }}
          source: "frontend/dist/**"
          target: "/home/clickeat/public_html"
          strip_components: 2

      # --- DEPLOY BACKEND TO NODEAPP ---
      - name: Deploy Backend to cPanel
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: ${{ secrets.SFTP_PORT }}
          source: "backend/dist/**"
          target: "/home/clickeat/nodeapp"
          strip_components: 2

      # --- TRIGGER PASSENGER RESTART ---
      - name: Restart Node.js Application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: ${{ secrets.SFTP_PORT }}
          script: |
            mkdir -p /home/clickeat/nodeapp/tmp
            touch /home/clickeat/nodeapp/tmp/restart.txt

