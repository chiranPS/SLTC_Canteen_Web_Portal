name: CI/CD Deploys to cPanel

on:
  push:
    branches:
      - main  # Triggers the workflow whenever you push to the main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download the repository code to the runner
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # --- BUILD FRONTEND ---
      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      # --- BUILD BACKEND ---
      # Install prod dependencies and generate Prisma client on the runner
      # so the server never needs to run npm install.
      - name: Build Backend
        run: |
          cd backend
          npm ci
          npm run build
          # Prune devDependencies in backend/ to leave only production ones
          npm install --omit=dev
          # Generate Prisma client for all target platforms (including cPanel's Linux)
          npx prisma generate
          # Create a deploy folder mimicking the server layout
          mkdir deploy-backend
          cp -r dist deploy-backend/
          cp package.json deploy-backend/
          cp -r prisma deploy-backend/
          cp -r node_modules deploy-backend/

      # --- DEPLOY FRONTEND TO PUBLIC_HTML ---
      - name: Deploy Frontend to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./frontend/dist/
          server-dir: /public_html/
          dangerous-clean-slate: false  # Safe: doesn't delete other files like .well-known or api.click2eat.xyz

      # --- DEPLOY BACKEND TO NODEAPP ---
      # Uploads the compiled JS + production node_modules + prisma schema directly.
      # No npm install needed on the server — everything is pre-built on the runner.
      - name: Deploy Backend to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./backend/deploy-backend/
          server-dir: /nodeapp/
          dangerous-clean-slate: false

      # --- TRIGGER PASSENGER RESTART ---
      # Passenger automatically restarts the application when tmp/restart.txt is touched.
      - name: Trigger App Restart
        run: |
          mkdir -p tmp
          echo "$(date)" > tmp/restart.txt

      - name: Upload Restart Trigger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./tmp/
          server-dir: /nodeapp/tmp/
          dangerous-clean-slate: false
