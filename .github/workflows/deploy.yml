name: CI/CD Deploys to cPanel

on:
  push:
    branches:
      - main  # Triggers the workflow whenever you push to the main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download the repository code to the runner
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # --- BUILD FRONTEND ---
      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      # --- BUILD BACKEND ---
      - name: Build Backend
        run: |
          cd backend
          npm ci
          npm run build
          cp package.json dist/
          cp -r prisma dist/
          npm install --omit=dev --prefix dist/
          npx prisma generate --schema dist/prisma/schema.prisma
          
          # Package the distribution folder
          cd dist
          zip -r ../backend.zip .
          cd ..
          
          # Prepare deploy directory for zip
          mkdir deploy-backend
          mv backend.zip deploy-backend/
          
          # Prepare deploy directory for PHP trigger
          mkdir deploy-php
          cp scripts/unzip.php deploy-php/

      # --- DEPLOY FRONTEND TO PUBLIC_HTML ---
      - name: Deploy Frontend to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./frontend/dist/
          server-dir: /public_html/
          dangerous-clean-slate: false  # Safe: doesn't delete other files like .well-known or api.click2eat.xyz

      # --- DEPLOY BACKEND ZIP TO NODEAPP ---
      - name: Deploy Backend Zip to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./backend/deploy-backend/
          server-dir: /nodeapp/
          dangerous-clean-slate: false

      # --- UPLOAD UNZIP TRIGGER TO PUBLIC_HTML ---
      - name: Upload Unzip Trigger to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./backend/deploy-php/
          server-dir: /public_html/
          dangerous-clean-slate: false

      # --- RUN UNZIP TRIGGER ON SERVER ---
      - name: Extract Deployed Backend
        run: |
          RESPONSE=$(curl -s https://click2eat.xyz/unzip.php)
          echo "Server Response: $RESPONSE"
          if [ "$RESPONSE" != "UNZIP_SUCCESS" ]; then
            echo "Error: Unzipping backend failed on the server!"
            exit 1
          fi

      # --- TRIGGER PASSENGER RESTART ---
      # Passenger automatically restarts the application when a file named tmp/restart.txt is created or modified.
      - name: Trigger App Restart
        run: |
          mkdir -p tmp
          echo "$(date)" > tmp/restart.txt
      
      - name: Upload Restart Trigger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./tmp/
          server-dir: /nodeapp/tmp/
          dangerous-clean-slate: false


